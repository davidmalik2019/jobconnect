<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JobConnect | Change Password</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f7fb;

            color: #333;

            min-height: 100vh;

        }


        /* =========================================
           HEADER
        ========================================= */

        .change-header {

            background: #0b2a4a;

            color: white;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            box-shadow: 0 2px 8px rgba(0,0,0,0.12);

        }


        .change-logo {

            font-size: 24px;

            font-weight: bold;

            letter-spacing: 0.5px;

        }


        .change-nav {

            display: flex;

            align-items: center;

            gap: 25px;

        }


        .change-nav a {

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;

        }


        .change-nav a:hover {

            text-decoration: underline;

        }


        /* =========================================
           MAIN
        ========================================= */

        .change-main {

            min-height: calc(100vh - 130px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 50px 20px;

        }


        /* =========================================
           CARD
        ========================================= */

        .password-card {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

        }


        .password-icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #eaf2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

        }


        .password-card h1 {

            text-align: center;

            color: #0b2a4a;

            font-size: 28px;

            margin-bottom: 8px;

        }


        .password-description {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;

            font-weight: 600;

        }


        .form-group input {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #d5dce5;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            background: #fff;

            transition: border-color 0.2s,
                        box-shadow 0.2s;

        }


        .form-group input:focus {

            border-color: #0b5ed7;

            box-shadow:
                0 0 0 3px rgba(11, 94, 215, 0.10);

        }


        .password-hint {

            display: block;

            margin-top: 6px;

            color: #888;

            font-size: 12px;

        }


        /* =========================================
           MESSAGE
        ========================================= */

        #passwordMessage {

            min-height: 20px;

            text-align: center;

            margin: 5px 0 18px;

            font-size: 14px;

            font-weight: 600;

        }


        .success-message {

            color: #198754;

        }


        .error-message {

            color: #dc3545;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .password-actions {

            display: flex;

            gap: 12px;

            margin-top: 10px;

        }


        .change-password-btn {

            flex: 1;

            height: 46px;

            border: none;

            border-radius: 7px;

            background: #0b5ed7;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.2s;

        }


        .change-password-btn:hover {

            background: #084298;

        }


        .cancel-password-btn {

            flex: 1;

            height: 46px;

            border: 1px solid #d5dce5;

            border-radius: 7px;

            background: #f8f9fa;

            color: #555;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

            font-weight: 600;

            transition: background 0.2s;

        }


        .cancel-password-btn:hover {

            background: #e9ecef;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .change-footer {

            height: 60px;

            background: #0b2a4a;

            color: #dce6f0;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-size: 13px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .change-header {

                padding: 0 20px;

            }


            .change-logo {

                font-size: 20px;

            }


            .change-nav {

                gap: 15px;

            }


            .change-nav a {

                font-size: 13px;

            }


            .change-main {

                padding: 30px 15px;

            }


            .password-card {

                padding: 30px 22px;

            }


            .password-card h1 {

                font-size: 24px;

            }


            .password-actions {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="change-header">

        <div class="change-logo">
            JobConnect
        </div>

        <nav class="change-nav">

            <a href="profile.html">
                Profile
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        </nav>

    </header>


    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="change-main">

        <div class="password-card">


            <div class="password-icon">
                🔐
            </div>


            <h1>
                Change Password
            </h1>


            <p class="password-description">
                Update your JobConnect account password
            </p>


            <form id="changePasswordForm">


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter your current password"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        required
                    >

                    <span class="password-hint">
                        Password must be at least 6 characters.
                    </span>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <div id="passwordMessage"></div>


                <!-- BUTTONS -->

                <div class="password-actions">

                    <button
                        type="submit"
                        class="change-password-btn">

                        Change Password

                    </button>


                    <a
                        href="profile.html"
                        class="cancel-password-btn">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="change-footer">

        &copy; 2026 JobConnect. All rights reserved.

    </footer>


    <script>


        /* =========================================
           CHECK LOGIN
        ========================================= */

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "login.html";

        }


        /* =========================================
           LOGOUT
        ========================================= */

        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("username");

            localStorage.removeItem("role");

            window.location.href =
                "login.html";

        }


        /* =========================================
           CHANGE PASSWORD
        ========================================= */

        document
            .getElementById("changePasswordForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const currentPassword =
                        document
                            .getElementById("currentPassword")
                            .value;


                    const newPassword =
                        document
                            .getElementById("newPassword")
                            .value;


                    const confirmPassword =
                        document
                            .getElementById("confirmPassword")
                            .value;


                    const message =
                        document
                            .getElementById("passwordMessage");


                    message.textContent = "";

                    message.className = "";


                    /* =====================================
                       FRONTEND VALIDATION
                    ===================================== */

                    if (newPassword.length < 6) {

                        message.textContent =
                            "New password must be at least 6 characters.";

                        message.className =
                            "error-message";

                        return;

                    }


                    if (newPassword !== confirmPassword) {

                        message.textContent =
                            "New passwords do not match.";

                        message.className =
                            "error-message";

                        return;

                    }


                    /* =====================================
                       SEND REQUEST
                    ===================================== */

                    try {

                        const response =
                            await fetch(
                                "http://localhost:8080/users/change-password",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token
                                    },

                                    body: JSON.stringify({

                                        currentPassword:
                                            currentPassword,

                                        newPassword:
                                            newPassword,

                                        confirmPassword:
                                            confirmPassword

                                    })
                                }
                            );


                        const result =
                            await response.text();


                        /* =====================================
                           SUCCESS
                        ===================================== */

                        if (response.ok) {

                            message.textContent =
                                result;

                            message.className =
                                "success-message";


                            document
                                .getElementById(
                                    "changePasswordForm"
                                )
                                .reset();


                            setTimeout(function() {

                                localStorage.removeItem(
                                    "token"
                                );

                                localStorage.removeItem(
                                    "username"
                                );

                                localStorage.removeItem(
                                    "role"
                                );

                                window.location.href =
                                    "login.html";

                            }, 2000);

                        }


                        /* =====================================
                           ERROR
                        ===================================== */

                        else {

                            message.textContent =
                                result;

                            message.className =
                                "error-message";

                        }


                    } catch (error) {

                        console.error(error);

                        message.textContent =
                            "Unable to connect to the server.";

                        message.className =
                            "error-message";

                    }

                }
            );

    </script>


</body>

</html>
