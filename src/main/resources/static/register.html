
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JobConnect | Register</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- NAVIGATION BAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Job<span>Connect</span>
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="jobs.html">Jobs</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

				<li id="loginLink">
				    <a href="login.html?role=JOB_SEEKER">Login</a>
				</li>
            </ul>

        </nav>

    </header>


    <!-- REGISTRATION SECTION -->

    <section class="register-section">

        <div class="register-container">

            <div class="register-header">

                <h1>Create Your Account</h1>

                <p>
                    Register as a Job Seeker on JobConnect
                </p>

            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    Create Account

                </button>


                <!-- MESSAGE -->

                <p id="registerMessage"></p>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-footer">

                <p>
                    Already have an account?
					<a href="login.html?role=JOB_SEEKER">
					    Login here
					</a>
                </p>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 JobConnect. All Rights Reserved.
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
